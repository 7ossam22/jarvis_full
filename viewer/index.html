<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS — Knowledge Galaxy</title>
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<style>
  :root {
    --bg: #05060a;
    --panel-bg: rgba(10, 14, 22, 0.88);
    --accent: #6be3ff;
    --accent-dim: rgba(107, 227, 255, 0.35);
    --text: #e8f1f7;
    --text-dim: #93a3b3;
    --ok: #7dffb0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: var(--text); }
  #graph { position: fixed; inset: 0; }

  /* ---- boot overlay ---- */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a1220 0%, #05060a 70%);
    gap: 22px;
  }
  #boot .ring {
    width: 84px; height: 84px; border-radius: 50%;
    border: 2px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    animation: pulse 2.4s ease-in-out infinite;
  }
  #boot .ring::after {
    content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 20px 4px var(--accent-dim);
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
  #boot h1 { font-weight: 300; letter-spacing: 0.35em; font-size: 15px; color: var(--text-dim); margin: 0; text-transform: uppercase; }
  #boot button {
    padding: 12px 28px; border-radius: 999px; border: 1px solid var(--accent-dim);
    background: rgba(107, 227, 255, 0.08); color: var(--accent); font-size: 14px;
    letter-spacing: 0.05em; cursor: pointer; transition: all .2s ease;
  }
  #boot button:hover { background: rgba(107, 227, 255, 0.18); }
  #boot small { color: var(--text-dim); font-size: 12px; max-width: 360px; text-align: center; line-height: 1.5; }

  /* ---- side panel ---- */
  #panel {
    position: fixed; top: 24px; right: 24px; width: 340px; max-height: calc(100vh - 190px);
    background: var(--panel-bg); border: 1px solid rgba(107, 227, 255, 0.18);
    border-radius: 14px; padding: 18px 20px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    transform: translateX(120%); opacity: 0; transition: transform .35s ease, opacity .35s ease;
    overflow-y: auto; z-index: 20;
  }
  #panel.open { transform: translateX(0); opacity: 1; }
  #panel .group-tag {
    display: inline-block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 999px;
    padding: 3px 10px; margin-bottom: 10px;
  }
  #panel h2 { margin: 0 0 10px; font-size: 18px; font-weight: 600; }
  #panel p { margin: 0; font-size: 13.5px; line-height: 1.6; color: var(--text-dim); white-space: pre-wrap; }
  #panel .close { position: absolute; top: 14px; right: 16px; cursor: pointer; color: var(--text-dim); font-size: 16px; }

  /* ---- top-left status ---- */
  #hud {
    position: fixed; top: 24px; left: 24px; z-index: 20; font-size: 11px; letter-spacing: 0.08em;
    color: var(--text-dim); text-transform: uppercase; display: flex; flex-direction: column; gap: 4px;
  }
  #hud .brand { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: 0.2em; }
  #status-line { position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%); z-index: 20;
    font-size: 12px; color: var(--accent); letter-spacing: 0.05em; min-height: 16px; opacity: 0.9; }

  /* ---- chat bar ---- */
  #dock {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 20;
    width: min(640px, 90vw); display: flex; align-items: center; gap: 10px;
    background: var(--panel-bg); border: 1px solid rgba(107, 227, 255, 0.18);
    border-radius: 999px; padding: 8px 10px 8px 20px; backdrop-filter: blur(10px);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  #dock input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  #dock input::placeholder { color: var(--text-dim); }
  #dock button {
    border: none; border-radius: 50%; width: 38px; height: 38px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    background: rgba(107, 227, 255, 0.1); color: var(--accent); transition: background .2s ease;
    flex-shrink: 0;
  }
  #dock button:hover { background: rgba(107, 227, 255, 0.22); }
  #dock button.recording { background: #ff5d6c; color: white; animation: pulse 1.2s ease-in-out infinite; }
  #dock button:disabled { opacity: 0.35; cursor: not-allowed; }

  #answer-toast {
    position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); z-index: 19;
    width: min(560px, 88vw); background: var(--panel-bg); border: 1px solid rgba(107, 227, 255, 0.18);
    border-radius: 12px; padding: 14px 18px; font-size: 13.5px; line-height: 1.55; color: var(--text);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .3s ease;
  }
  #answer-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="graph"></div>

<div id="hud">
  <div class="brand">J.A.R.V.I.S.</div>
  <div id="note-count"></div>
</div>

<div id="status-line"></div>
<div id="answer-toast"></div>

<div id="panel">
  <span class="close" id="panel-close">✕</span>
  <div class="group-tag" id="panel-group"></div>
  <h2 id="panel-title"></h2>
  <p id="panel-excerpt"></p>
</div>

<div id="dock">
  <button id="mic-btn" title="Talk to JARVIS">🎙</button>
  <input id="chat-input" type="text" placeholder="Ask about your notes, or say “remember that…”" autocomplete="off" />
  <button id="send-btn" title="Send">➤</button>
</div>

<div id="boot">
  <div class="ring"></div>
  <h1>Knowledge Galaxy</h1>
  <button id="wake-btn">Wake JARVIS</button>
  <small>Browsers block audio until you interact with the page once — click above to boot JARVIS and unlock his voice.</small>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Graph setup
  // ---------------------------------------------------------------------
  const graphData = { nodes: GRAPH.nodes.map(n => ({ ...n })), links: GRAPH.links.map(l => ({ ...l })) };
  const nodeById = id => graphData.nodes.find(n => n.id === id);

  const GROUP_PALETTE = ["#6be3ff", "#ff8fd6", "#ffd66b", "#8fff9e", "#c39bff", "#ff9b7a", "#7affe0", "#ffb1e6"];
  const groupColorCache = {};
  function groupColor(group) {
    if (!groupColorCache[group]) {
      const idx = Object.keys(groupColorCache).length % GROUP_PALETTE.length;
      groupColorCache[group] = GROUP_PALETTE[idx];
    }
    return groupColorCache[group];
  }

  // adjacency for "highlight neighbors"
  const neighborsOf = {};
  graphData.links.forEach(l => {
    const a = typeof l.source === "object" ? l.source.id : l.source;
    const b = typeof l.target === "object" ? l.target.id : l.target;
    (neighborsOf[a] ||= new Set()).add(b);
    (neighborsOf[b] ||= new Set()).add(a);
  });

  let highlightNodes = new Set();
  let highlightLinks = new Set();

  function linkKey(l) {
    const a = typeof l.source === "object" ? l.source.id : l.source;
    const b = typeof l.target === "object" ? l.target.id : l.target;
    return a < b ? `${a}-${b}` : `${b}-${a}`;
  }

  function setHighlight(nodeIds) {
    highlightNodes = new Set(nodeIds);
    highlightLinks = new Set();
    graphData.links.forEach(l => {
      const a = typeof l.source === "object" ? l.source.id : l.source;
      const b = typeof l.target === "object" ? l.target.id : l.target;
      if (highlightNodes.has(a) && highlightNodes.has(b)) highlightLinks.add(linkKey(l));
    });
    refreshStyles();
  }

  function clearHighlight() { setHighlight([]); }

  function refreshStyles() {
    Graph.nodeColor(Graph.nodeColor());
    Graph.nodeVal(Graph.nodeVal());
    Graph.linkColor(Graph.linkColor());
    Graph.linkWidth(Graph.linkWidth());
    Graph.linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  // simple radial-gradient glow texture, reused across all node sprites
  const glowTexture = (() => {
    const size = 128;
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.35, "rgba(255,255,255,0.55)");
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(c);
  })();

  const Graph = ForceGraph3D()(document.getElementById("graph"))
    .graphData(graphData)
    .backgroundColor("#05060a")
    .nodeLabel(n => `${n.label}`)
    .nodeColor(n => (highlightNodes.size === 0 || highlightNodes.has(n.id)) ? groupColor(n.group) : "rgba(120,130,150,0.25)")
    .nodeVal(n => highlightNodes.has(n.id) ? 9 : 4.5)
    .nodeResolution(16)
    .nodeOpacity(0.95)
    .linkColor(l => highlightLinks.has(linkKey(l)) ? "rgba(255,255,255,0.9)" : "rgba(120,140,200,0.15)")
    .linkWidth(l => highlightLinks.has(linkKey(l)) ? 2 : 0.5)
    .linkDirectionalParticles(l => highlightLinks.has(linkKey(l)) ? 2 : 0)
    .linkDirectionalParticleWidth(2)
    .linkDirectionalParticleSpeed(0.006)
    .nodeThreeObjectExtend(true)
    .nodeThreeObject(n => {
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTexture, color: groupColor(n.group), transparent: true,
        opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      sprite.scale.set(16, 16, 1);
      return sprite;
    })
    .onNodeClick(node => flyToNode(node, { openPanel: true }))
    .onBackgroundClick(() => { clearHighlight(); closePanel(); });

  Graph.controls().autoRotate = true;
  Graph.controls().autoRotateSpeed = 0.35;
  Graph.controls().addEventListener("start", () => { Graph.controls().autoRotate = false; });
  let idleTimer = null;
  Graph.controls().addEventListener("end", () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { Graph.controls().autoRotate = true; }, 4000);
  });

  // starfield background
  (function addStarfield() {
    const STAR_COUNT = 1800;
    const positions = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      const r = 900 + Math.random() * 1400;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({ color: 0xaad4ff, size: 1.6, transparent: true, opacity: 0.7 });
    Graph.scene().add(new THREE.Points(geometry, material));
    Graph.scene().fog = new THREE.FogExp2(0x05060a, 0.00045);
  })();

  // ---------------------------------------------------------------------
  // Camera flight / fly-to-source (Prompts 1 & 4)
  // ---------------------------------------------------------------------
  function flyToNode(node, opts = {}) {
    if (!node) return;
    const distance = 140;
    const distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
    Graph.cameraPosition(
      { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
      node,
      1400
    );
    const ids = new Set([node.id, ...(neighborsOf[node.id] || [])]);
    setHighlight(ids);
    if (opts.openPanel) openPanel(node);
  }

  function flyToCluster(ids) {
    const idSet = new Set(ids);
    setHighlight(idSet);
    Graph.zoomToFit(1400, 120, n => idSet.has(n.id));
  }

  // ---------------------------------------------------------------------
  // Side panel
  // ---------------------------------------------------------------------
  const panelEl = document.getElementById("panel");
  function openPanel(node) {
    document.getElementById("panel-group").textContent = node.group;
    document.getElementById("panel-title").textContent = node.label;
    document.getElementById("panel-excerpt").textContent = node.excerpt;
    panelEl.classList.add("open");
  }
  function closePanel() { panelEl.classList.remove("open"); }
  document.getElementById("panel-close").addEventListener("click", closePanel);

  // ---------------------------------------------------------------------
  // Voice — speech synthesis + recognition (Prompt 3), personality (Prompt 5)
  // ---------------------------------------------------------------------
  let audioUnlocked = false;
  let britishVoice = null;
  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    britishVoice = voices.find(v => /en-GB/i.test(v.lang)) || voices.find(v => /british/i.test(v.name)) || voices[0] || null;
  }
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();

  function speak(text) {
    if (!text || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (britishVoice) utter.voice = britishVoice;
    utter.rate = 1.0;
    utter.pitch = 0.95;
    speechSynthesis.speak(utter);
  }

  const statusEl = document.getElementById("status-line");
  function setStatus(text) { statusEl.textContent = text; }

  const answerToast = document.getElementById("answer-toast");
  function showAnswer(text) {
    answerToast.textContent = text;
    answerToast.classList.add("show");
    clearTimeout(showAnswer._t);
    showAnswer._t = setTimeout(() => answerToast.classList.remove("show"), 9000);
  }

  // mic (Chrome / Edge only)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById("mic-btn");
  let recognizer = null;
  if (SpeechRecognition) {
    recognizer = new SpeechRecognition();
    recognizer.lang = "en-US";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    recognizer.onstart = () => { micBtn.classList.add("recording"); setStatus("● listening…"); };
    recognizer.onerror = () => { micBtn.classList.remove("recording"); setStatus(""); };
    recognizer.onend = () => { micBtn.classList.remove("recording"); };
    recognizer.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      document.getElementById("chat-input").value = transcript;
      handleSubmit(transcript);
    };
    micBtn.addEventListener("click", () => {
      audioUnlocked = true;
      try { recognizer.start(); } catch (e) { /* already running */ }
    });
  } else {
    micBtn.disabled = true;
    micBtn.title = "Voice input needs Chrome or Edge";
  }

  // ---------------------------------------------------------------------
  // Session + chat / remember flow (Prompts 2, 4, 5, 6)
  // ---------------------------------------------------------------------
  const SESSION_KEY = "jarvis_session_id";
  let sessionId = sessionStorage.getItem(SESSION_KEY);
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));
    sessionStorage.setItem(SESSION_KEY, sessionId);
  }

  const input = document.getElementById("chat-input");
  document.getElementById("send-btn").addEventListener("click", () => handleSubmit(input.value));
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") handleSubmit(input.value); });

  async function handleSubmit(text) {
    text = (text || "").trim();
    if (!text) return;
    input.value = "";
    audioUnlocked = true;

    if (/^remember that\b/i.test(text)) {
      await handleRemember(text);
      return;
    }
    await handleChat(text);
  }

  async function handleChat(text) {
    setStatus("● thinking…");
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      const data = await res.json();
      setStatus("");
      showAnswer(data.answer || "");
      speak(data.answer || "");

      const ids = data.nodes || [];
      if (ids.length >= 4) {
        flyToCluster(ids);
        closePanel();
      } else if (ids.length >= 1) {
        const node = nodeById(ids[0]);
        if (node) flyToNode(node, { openPanel: true });
      }
      // small talk (ids.length === 0): no camera movement, per the personality spec.
    } catch (err) {
      setStatus("");
      showAnswer("I couldn't reach the server, sir. Is server.py still running?");
    }
  }

  async function handleRemember(text) {
    setStatus("● thinking…");
    try {
      const res = await fetch("/remember", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text, session_id: sessionId }),
      });
      const data = await res.json();
      setStatus("");
      if (!data.node) {
        showAnswer(data.confirmation || "I couldn't file that, sir.");
        speak(data.confirmation || "");
        return;
      }

      const relatedNode = data.related_id != null ? nodeById(data.related_id) : null;
      const newNode = { ...data.node };
      if (relatedNode) {
        newNode.x = relatedNode.x + (Math.random() - 0.5) * 4;
        newNode.y = relatedNode.y + (Math.random() - 0.5) * 4;
        newNode.z = relatedNode.z + (Math.random() - 0.5) * 4;
      }

      graphData.nodes.push(newNode);
      if (relatedNode) graphData.links.push({ source: relatedNode.id, target: newNode.id });
      (neighborsOf[newNode.id] ||= new Set());
      if (relatedNode) {
        neighborsOf[newNode.id].add(relatedNode.id);
        (neighborsOf[relatedNode.id] ||= new Set()).add(newNode.id);
      }

      Graph.graphData(graphData);
      document.getElementById("note-count").textContent = `${data.notes_count} notes indexed`;

      showAnswer(data.confirmation || "");
      speak(data.confirmation || "");

      setTimeout(() => flyToNode(newNode, { openPanel: true }), 400);
      setTimeout(clearHighlight, 3200);
    } catch (err) {
      setStatus("");
      showAnswer("I couldn't file that, sir — is server.py still running?");
    }
  }

  // ---------------------------------------------------------------------
  // Boot sequence
  // ---------------------------------------------------------------------
  document.getElementById("note-count").textContent = `${graphData.nodes.length} notes indexed`;

  document.getElementById("wake-btn").addEventListener("click", () => {
    audioUnlocked = true;
    document.getElementById("boot").style.display = "none";
    const greeting = `Good evening, sir. ${graphData.nodes.length} notes indexed, all present and accounted for.`;
    showAnswer(greeting);
    speak(greeting);
  });
})();
</script>
</body>
</html>
