<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS — Neural Core</title>
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<div id="graph"></div>

<div id="hud">
  <div class="brand">J.A.R.V.I.S.</div>
  <div id="note-count"></div>
</div>

<div id="status-line"></div>
<div id="answer-toast"></div>

<div id="panel">
  <span class="close" id="panel-close">✕</span>
  <div class="group-tag" id="panel-group"></div>
  <h2 id="panel-title"></h2>
  <p id="panel-excerpt"></p>
</div>

<div id="reference-layer"></div>

<div id="dock">
  <button id="mic-btn" title="Toggle always-listening (say “Jarvis” to talk)">🎙</button>
  <input id="chat-input" type="text" placeholder="Ask about your notes, or say “remember that…”" autocomplete="off" />
  <button id="send-btn" title="Send">➤</button>
</div>

<div id="boot">
  <div class="ring"></div>
  <h1>Neural Core</h1>
  <button id="wake-btn">Wake JARVIS</button>
  <small>Browsers block audio until you interact with the page once — click above to boot JARVIS and unlock his voice. Once awake, he's always listening — just say “Jarvis” before your question.</small>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
